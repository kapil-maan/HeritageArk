{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel form-narrow">
  <h1>{{ title }}</h1>
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %} novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="btn" type="submit">{{ submit_label|default:"Submit" }}</button>
  </form>
  {% if footer_link %}
    <p class="muted small">{{ footer_link.0 }} <a href="{% url footer_link.2 %}">{{ footer_link.1 }}</a></p>
  {% endif %}
</div>
{% endblock %}
